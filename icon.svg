<svg xmlns="http://www.w3.org/2000/svg"
     width="256"
     height="256"
     viewBox="0 0 256 256"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Pufflow</title>
  <desc id="desc">
    A soft cloud containing a flowing line, pipeline nodes,
    and a forward arrow.
  </desc>

  <!-- Dark background -->
  <rect width="256" height="256" rx="56" fill="#142338"/>

  <!-- Puff silhouette -->
  <path
    d="M76 188
       C50 188 32 170 32 147
       C32 128 44 112 62 107
       C60 83 78 64 101 64
       C117 64 130 72 137 84
       C144 78 153 75 163 75
       C184 75 201 91 202 112
       C216 119 224 132 224 147
       C224 170 207 188 183 188
       Z"
    fill="#F5F8FC"/>

  <!-- Flow through the pipeline -->
  <path
    d="M67 148
       H82
       C101 148 98 117 119 117
       C140 117 138 148 159 148
       H185"
    fill="none"
    stroke="#142338"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Direction -->
  <path
    d="M174 136 L187 148 L174 160"
    fill="none"
    stroke="#142338"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Pipeline nodes -->
  <circle cx="67" cy="148" r="10" fill="#20C5C5"/>
  <circle cx="119" cy="117" r="10" fill="#20C5C5"/>
  <circle cx="159" cy="148" r="10" fill="#20C5C5"/>
</svg>